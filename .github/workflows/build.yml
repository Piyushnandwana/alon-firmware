name: Build Alon firmware

# Builds the Alon sketch into a single flashable .bin in the cloud.
# Works whether Alon.ino sits at the repo root or inside an Alon/ folder.
# After it runs, download the .bin from the run's "Artifacts".

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core + libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10
          arduino-cli lib install "GFX Library for Arduino"
          arduino-cli lib install "SensorLib"

      - name: Arrange the sketch folder (tolerates a root-level Alon.ino)
        run: |
          mkdir -p sketchdir/Alon
          if [ -f "Alon.ino" ]; then
            cp "Alon.ino" sketchdir/Alon/Alon.ino
          elif [ -f "Alon/Alon.ino" ]; then
            cp "Alon/Alon.ino" sketchdir/Alon/Alon.ino
          else
            echo "Could not find Alon.ino at the repo root or in Alon/."; ls -la; exit 1
          fi
          # copy any companion headers (e.g. the avatar images) next to the sketch
          for h in *.h Alon/*.h; do [ -f "$h" ] && cp "$h" sketchdir/Alon/ || true; done
          echo "sketch folder:"; ls -l sketchdir/Alon/

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,CDCOnBoot=cdc" \
            --export-binaries \
            --output-dir build \
            sketchdir/Alon

      - name: Collect the single 0x0 image
        run: |
          mkdir -p out
          MERGED=$(find build -name "*.merged.bin" | head -n1)
          if [ -z "$MERGED" ]; then
            echo "No .merged.bin found; listing build dir:"; find build -name "*.bin"
            exit 1
          fi
          cp "$MERGED" out/Alon-flash-at-0x0.bin
          ls -l out

      - name: Upload the .bin as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alon-firmware
          path: out/Alon-flash-at-0x0.bin
          if-no-files-found: error

      - name: Attach the .bin to a Release (only when you push a tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/Alon-flash-at-0x0.bin

      # Publish the RAW .bin to a separate 'firmware-bin' branch so it can be
      # downloaded directly from raw.githubusercontent.com (a plain .bin, not a
      # zip) - helps when an org policy blocks the Actions artifact zip.
      - name: Publish raw .bin to firmware-bin branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/pub && cp out/Alon-flash-at-0x0.bin /tmp/pub/Alon-flash-at-0x0.bin
          cd /tmp/pub
          git init -q
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git checkout -q -b firmware-bin
          echo "Latest Alon firmware. Flash Alon-flash-at-0x0.bin at offset 0x0." > README.md
          git add -A
          git commit -q -m "firmware build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" firmware-bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
